; K-Line reader v2 for Honda Air Blade 125 (2023).
;
;   c3_supermini  ESP32-C3 SuperMini + L9637D board (default)
;   wrover_2n2222 old ESP32-WROVER-E + 2N2222 discrete interface (TX inverted)

[platformio]
default_envs = c3_supermini

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

[env:c3_supermini]
board = esp32-c3-devkitm-1
build_flags =
    ; DashPacket (ESP-NOW format) is shared by both firmwares.
    -I ../common
    ; Serial goes over the C3's native USB port.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; GPIO2/8/9 are strapping pins, GPIO20/21 carry the boot log: avoid them for K-Line.
    -DK_RX_PIN=3
    -DK_TX_PIN=4
    ; L9637D is non-inverting.
    -DK_TX_INVERTED=0
    ; On-board blue LED (active low).
    -DSTATUS_LED_PIN=8
    -DSTATUS_LED_ACTIVE_LOW=1
    ; Many SuperMini boards have an unstable WiFi at full power; 8.5 dBm is the usual fix.
    -DWIFI_TX_POWER=WIFI_POWER_8_5dBm

[env:wrover_2n2222]
board = esp32dev
upload_speed = 460800
board_build.partitions = huge_app.csv
build_flags =
    ; DashPacket (ESP-NOW format) is shared by both firmwares.
    -I ../common
    ; WROVER uses GPIO16/17 for PSRAM.
    -DK_RX_PIN=25
    -DK_TX_PIN=26
    ; The 2N2222 stage inverts TX.
    -DK_TX_INVERTED=1
